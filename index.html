<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pick any link like /yourname and share text, code, images and PDFs that expire when you choose. No sign-up." />
    <meta name="theme-color" content="#111111" />
    <meta property="og:title" content="GetCodeSnap – Capture. Share. Code." />
    <meta property="og:description" content="Pick any link like /yourname and share text, code, images and PDFs that expire when you choose. No sign-up." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem('getcodesnap:theme')
        document.documentElement.dataset.theme =
          t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>GetCodeSnap – Capture. Share. Code.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
